[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdl"
version = "0.1.0"
description = "Personal YouTube video / audio downloader (MediaHuman-style CLI)."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.10.7",
    "mutagen>=1.47.0",
]

[project.scripts]
ytdl = "ytdl.cli:main"

[tool.setuptools.packages.find]
include = ["ytdl*"]
